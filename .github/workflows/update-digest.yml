name: Update fedora digest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Get latest digest
        id: digest
        run: |
          DIGEST=$(crane digest quay.io/fedora/fedora:44)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Update Containerfile.fedora-base
        run: |
          sed -i "s|quay.io/fedora/fedora:44@sha256:[a-f0-9]*|quay.io/fedora/fedora:44@${{ steps.digest.outputs.digest }}|" Containerfile.fedora-base

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Containerfile.fedora-base
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update fedora digest to ${{ steps.digest.outputs.digest }}"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
