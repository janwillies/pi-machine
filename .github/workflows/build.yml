name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - Containerfile.fedora-base
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref or commit SHA to check out'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.fedora-base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fedora-base:latest
          platforms: linux/arm64

      - name: Build and push pi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pi:latest
          platforms: linux/arm64
