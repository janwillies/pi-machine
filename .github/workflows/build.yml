name: Build and push

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - Containerfile.hummingbird-base
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.hummingbird-base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hummingbird-base:latest
          platforms: linux/arm64

      - name: Build and push pi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pi:latest
          platforms: linux/arm64
